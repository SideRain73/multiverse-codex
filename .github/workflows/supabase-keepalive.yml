name: Keep Supabase Awake

# The free tier pauses a project after 7 days with no API activity. This pings
# the project every 5 days so a quiet week never leaves it asleep.
# Scheduled runs only fire from the default branch.
# Secrets (Settings > Secrets and variables > Actions): SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    # Days 1, 6, 11, 16, 21, 26 (and 31) of each month at 06:00 UTC: never
    # more than 5 days apart, inside the 7-day pause window.
    - cron: "0 6 */5 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase
        run: |
          # /rest/v1/ rejects anon/publishable keys with 401; the Auth health
          # endpoint accepts any valid project key.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded HTTP $code"
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Keep-alive ping failed with HTTP $code -- check SUPABASE_URL / SUPABASE_ANON_KEY, or whether the project is already paused."
            exit 1
          fi
